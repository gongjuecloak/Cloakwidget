name: Release

# 推一个 v* 标签即触发：跑测试 → 构建 Windows exe（带版本资源）→ 建 Release 并上传 exe
# 用法：本地改好版本号后
#   git tag v1.7.0 && git push --tags
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'mes_conv/go.mod'
      - name: go vet
        working-directory: mes_conv
        run: go vet ./...
      - name: go test
        working-directory: mes_conv
        run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'mes_conv/go.mod'

      - name: 从 tag 推导版本号
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 把版本号写回源码（version.go / versioninfo.json）
        working-directory: mes_conv
        run: |
          V="${{ steps.ver.outputs.version }}"
          python3 - <<PY
          import re, sys
          v = "${{ steps.ver.outputs.version }}"
          parts = [int(x) for x in v.split(".")] + [0, 0, 0]
          mj, mn, pa, bd = parts[0], parts[1], parts[2], parts[3]

          # version.go: const appVersion = "x.y.z"
          g = open("version.go", encoding="utf-8").read()
          g = re.sub(r'(const appVersion = ")[^"]+(")', r'\g<1>%s\2' % v, g, count=1)
          open("version.go", "w", encoding="utf-8").write(g)

          # versioninfo.json: 同时更新数字段与字符串字段
          s = open("versioninfo.json", encoding="utf-8").read()
          s = re.sub(r'("FileVersion":\s*\{\s*"Major":\s*)\d+', r'\g<1>%d' % mj, s, count=1)
          s = re.sub(r'("Minor":\s*)\d+', r'\g<1>%d' % mn, s, count=1)
          s = re.sub(r'("Patch":\s*)\d+', r'\g<1>%d' % pa, s, count=1)
          s = re.sub(r'("Build":\s*)\d+', r'\g<1>%d' % bd, s, count=1)
          s = re.sub(r'("ProductVersion":\s*\{\s*"Major":\s*)\d+', r'\g<1>%d' % mj, s, count=1)
          s = re.sub(r'("FileVersion":\s*")[^"]+(")', r'\g<1>%d.%d.%d.%d\2' % (mj, mn, pa, bd), s)
          s = re.sub(r'("ProductVersion":\s*")[^"]+(")', r'\g<1>%d.%d.%d.%d\2' % (mj, mn, pa, bd), s)
          open("versioninfo.json", "w", encoding="utf-8").write(s)
          print("版本号已同步为", v)
          PY

      - name: 安装 goversioninfo（生成版本资源用）
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest

      - name: 生成版本资源 .syso
        working-directory: mes_conv
        run: |
          if [ -x "$(go env GOPATH)/bin/goversioninfo" ]; then
            "$(go env GOPATH)/bin/goversioninfo" -o resource_windows_amd64.syso versioninfo.json
            echo "已生成 resource_windows_amd64.syso"
          else
            echo "goversioninfo 不可用，跳过版本资源（exe 将不带图标/版本信息）"
          fi

      - name: 构建 Windows exe
        working-directory: mes_conv
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          BT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -ldflags "-s -w -H=windowsgui -X main.buildTime=$BT" \
            -o "MES-Converter-${{ github.ref_name }}.exe" .

      - name: 判定是否启用代码签名
        id: signcheck
        env:
          PFX_B64: ${{ secrets.CODESIGN_PFX }}
        run: |
          if [ -n "$PFX_B64" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi

      - name: （可选）代码签名
        # 仅当仓库配置了 CODESIGN_PFX 机密时才执行。
        # 注意：secrets 上下文不能用于 if 表达式，故用上一步的 outputs.enabled 来门控。
        # 自签名证书对 SmartScreen 无效，这里面向的是 OV/EV 证书（PEM 或 PFX 的 base64）。
        if: steps.signcheck.outputs.enabled == 'true'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.CODESIGN_PFX }}
          PFX_PWD: ${{ secrets.CODESIGN_PASSWORD }}
        run: |
          $exe = "mes_conv/MES-Converter-${{ github.ref_name }}.exe"
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [System.Convert]::FromBase64String($env:PFX_B64) | Set-Content -Path $pfx -AsByteStream
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, $env:PFX_PWD)
          Set-AuthenticodeSignature -FilePath $exe -Certificate $cert `
            -TimestampServer "http://timestamp.digicert.com"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: exe
          path: mes_conv/MES-Converter-${{ github.ref_name }}.exe

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: exe
          path: ./dist

      - name: 生成 version.json 清单（含 SHA256，供客户端校验）
        run: |
          EXE="dist/MES-Converter-${{ github.ref_name }}.exe"
          VER="${{ github.ref_name }}"
          VER="${VER#v}"
          SHA=$(sha256sum "$EXE" | awk '{print $1}')
          SIZE=$(stat -c%s "$EXE")
          cat > dist/version.json <<JSON
          {
            "version": "$VER",
            "exe": {
              "name": "MES-Converter-${{ github.ref_name }}.exe",
              "url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/MES-Converter-${{ github.ref_name }}.exe",
              "sha256": "$SHA",
              "size": $SIZE
            }
          }
          JSON
          echo "version.json 内容："; cat dist/version.json

      - name: 签名 version.json（Ed25519，建立供应链信任根）
        # 用仓库 secret MES_SIGN_PRIVATE_KEY 签清单。值为 base64 的 ed25519 私钥
        # （32 字节 seed 或 64 字节 seed||pub）。客户端内置对应公钥验签。
        # 未配置该 secret 时跳过签名（客户端按未签名清单处理）。
        env:
          MES_PRIV: ${{ secrets.MES_SIGN_PRIVATE_KEY }}
        run: |
          if [ -z "$MES_PRIV" ]; then
            echo "未配置 MES_SIGN_PRIVATE_KEY，跳过清单签名（客户端将按未签名处理）"
            exit 0
          fi
          python3 - <<'PY'
          import base64, os, subprocess, sys
          s = os.environ.get("MES_PRIV", "").strip()
          s = "".join(s.split())              # 容忍误粘贴的换行/空白
          s += "=" * (-len(s) % 4)            # 补齐 padding（结尾 == 常在粘贴时被吞）
          try:
              priv = base64.b64decode(s)
          except Exception as e:
              print("base64 解码失败：%s（请确认 secret 是完整的 base64 私钥）" % e, file=sys.stderr)
              sys.exit(1)
          seed = priv[:32]
          if len(seed) != 32:
              print("私钥长度异常：解码得 %d 字节。ed25519 私钥应为 32 或 64 字节"
                    "（base64 44/88 字符）。常见原因：粘贴时漏了结尾 == 或少复制了字符。"
                    % len(priv), file=sys.stderr)
              sys.exit(1)
          der = bytes.fromhex("302e020100300506032b657004220420") + seed   # raw seed -> PKCS#8 DER
          open("/tmp/priv.der", "wb").write(der)
          subprocess.run([
            "openssl", "pkeyutl", "-sign", "-inkey", "/tmp/priv.der",
            "-keyform", "DER", "-rawin", "-in", "dist/version.json", "-out", "dist/version.sig"
          ], check=True)
          print("已生成 dist/version.sig")
          PY

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          # 用 ASCII 文件名（GitHub 对非 ASCII 的 asset 名会静默改写，曾踩过坑）
          # version.json 为更新清单：客户端据此校验 SHA256 后再替换。
          files: |
            dist/MES-Converter-${{ github.ref_name }}.exe
            dist/version.json
            dist/version.sig
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
