# MES 更新镜像 · 宝塔/NGINX 反代配置样例
#
# 当前域名：x.lzplus.top（根路径，已不再托管 Mastodon，故可直接走根）
# 反代目标：本机 127.0.0.1:18080（docker 宿主映射端口）
#
# 部署方式（宝塔）：
#   站点管理 → 配置文件，替换为下方内容（注意 server_name 与证书路径）。
# 或纯 NGINX：放到 conf.d/ 下后 nginx -t && nginx -s reload。
#
# 关于 TLS：
#   外层由 Cloudflare（橙云）终止 TLS 并发回源；源站可用 80（Cloudflare→源站 80）
#   或配置 Cloudflare Origin Certificate + 下方 443 段以加密回源。
#   若关闭 Cloudflare 代理（灰云），请务必启用 443 + 证书，避免明文暴露。

server {
    listen 80;
    server_name x.lzplus.top;
    # 如需明文回源（Cloudflare 橙云场景），保留 80 即可；
    # 若想强制 HTTPS，取消下行注释并启用下方 443 段：
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    access_log off;
}

